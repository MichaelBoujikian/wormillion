# Netlify serves the game straight from src/ - there is no build step, the same
# folder GitHub Pages publishes (.github/workflows/deploy.yml). Without this the
# site root is the repository root, which has no index.html.
[build]
  publish = "src"
  # Not a build, a gate: the two checks CI runs. A red suite does not deploy.
  command = "npm test && npm run validate"

[build.environment]
  NODE_VERSION = "22"

# The daily comparison (Spec 3.17): two functions over Netlify Blobs. The
# handlers bundle the engine (src/js) through lib/daily.js; the bank itself
# is read from disk at runtime, so its two files ride along.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["src/data/bank.js", "src/data/themes.js"]
